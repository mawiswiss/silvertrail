<!doctype html>
<html lang="en-GB">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{title}} · Silvertrail docs</title>
	<meta name="description" content="{{description}}">
	<link rel="canonical" href="{{canonical}}">
	<link rel="alternate" type="text/markdown" href="{{markdown}}" title="{{title}} as Markdown">
	<meta name="author" content="Marc Wieland">
	<meta name="color-scheme" content="dark">
	<meta name="theme-color" content="#1c2118">
	<meta property="og:type" content="article">
	<meta property="og:site_name" content="Silvertrail">
	<meta property="og:locale" content="en_GB">
	<meta property="og:url" content="{{canonical}}">
	<meta property="og:title" content="{{title}} · Silvertrail docs">
	<meta property="og:description" content="{{description}}">
	<meta property="og:image" content="https://silvertrail.marcwieland.name/og.png">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta property="og:image:alt" content="Silvertrail: nothing loads until visitors say yes. A cookie banner with the buttons Accept all and Only essential.">
	<meta name="twitter:card" content="summary_large_image">
	<link rel="icon" href="/favicon.ico" sizes="32x32">
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="/apple-touch-icon.png">
	<link rel="preload" href="/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
	<style>
		@font-face {
			font-family: Manrope;
			src: url("/fonts/manrope.woff2") format("woff2");
			font-weight: 200 800;
			font-display: swap;
		}

		:root {
			--dark: #2b3326;
			--sage: #e3e8d8;
			--pale: #f4f6ef;
			--lime: #cfe39a;
			--bg: #1c2118;
			--hero-bg: var(--bg);
			--hero-text: var(--pale);
			--hero-muted: #c5ccb6;
			--text: var(--pale);
			--muted: #c5ccb6;
			--line: #3a4332;
			--line-strong: #6f7a62;
			--tile: #2a3124;
			--code-bg: #262d21;
			--pre-bg: #161a13;

			color-scheme: dark;
			font-family: Manrope, system-ui, sans-serif;
			line-height: 1.6;
			color: var(--text);
			background: var(--bg);
		}

		* { box-sizing: border-box; }

		body { margin: 0; }

		a { color: inherit; text-underline-offset: 0.2em; }

		:focus-visible {
			outline: 3px solid var(--lime);
			outline-offset: 3px;
		}

		code, pre {
			font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
		}

		.wrap {
			max-width: 68rem;
			margin: 0 auto;
			padding: 0 1rem;
		}

		.skip {
			position: absolute;
			inset-inline-start: 1rem;
			inset-block-start: -10rem;
			padding: 0.5rem 1rem;
			background: var(--sage);
			color: var(--dark);
			font-weight: 600;
			z-index: 20;
		}

		.skip:focus { inset-block-start: 1rem; }

		/* Header, the same on every page. /header.js sets data-state while the page scrolls. */

		html { scroll-padding-top: 1.5rem; }

		html:has(.site-header[data-state="shown"]) { scroll-padding-top: 6.5rem; }

		.site-header {
			position: relative;
			z-index: 10;
		}

		.site-header[data-state] {
			position: sticky;
			top: 0;
		}

		.site-header[data-state="hidden"]:not(:has(:focus-visible)) {
			translate: 0 -100%;
			opacity: 0;
		}

		@media (prefers-reduced-motion: no-preference) {
			html { scroll-behavior: smooth; }

			.site-header[data-state] { transition: translate 0.3s ease, opacity 0.3s ease; }

			.site-header__bar { transition: box-shadow 0.3s ease; }
		}

		.site-header__bar {
			background: var(--hero-bg);
			color: var(--hero-text);
		}

		.site-header[data-state="shown"] .site-header__bar { box-shadow: 0 1px 0 rgb(255 255 255 / 0.08), 0 0.75rem 2rem rgb(0 0 0 / 0.35); }

		.topbar {
			display: flex;
			flex-wrap: wrap;
			justify-content: space-between;
			align-items: center;
			gap: 1rem;
			padding-block: 1.25rem;
		}

		.wordmark {
			display: inline-flex;
			align-items: center;
			gap: 0.625rem;
			font-weight: 800;
			font-size: 1.25rem;
			letter-spacing: -0.02em;
			text-decoration: none;
		}

		.topbar__links {
			display: flex;
			align-items: center;
			gap: 1.75rem;
		}

		.topbar__links a {
			font-weight: 600;
			text-decoration: none;
		}

		.topbar__links a:hover,
		.topbar__links a[aria-current] { text-decoration: underline; }

		.topbar__links a.topbar__licence {
			padding: 0.5rem 1rem;
			border: 1.5px solid var(--hero-muted);
		}

		.topbar__links a.topbar__licence:hover {
			background: var(--pale);
			border-color: var(--pale);
			color: var(--dark);
			text-decoration: none;
		}

		@media (max-width: 40rem) {
			.topbar__links {
				gap: 1rem;
				font-size: 0.9375rem;
			}

			.topbar__links a:not(.topbar__licence, .topbar__docs) { display: none; }
		}

		@media (max-width: 23rem) {
			.wordmark span {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				clip-path: inset(50%);
				white-space: nowrap;
			}
		}

		/* Layout */

		.docs {
			display: grid;
			gap: 2rem;
			padding-block: 1.5rem 5rem;
		}

		@media (min-width: 60rem) {
			.docs {
				grid-template-columns: 14rem minmax(0, 1fr);
				gap: 3.5rem;
				padding-block-start: 3rem;
			}
		}

		/* Navigation */

		.docs-nav ul {
			margin: 0;
			padding: 0;
			list-style: none;
		}

		.docs-nav__pages {
			display: flex;
			flex-wrap: wrap;
			gap: 0.375rem;
		}

		.docs-nav__pages > li > a {
			display: block;
			padding: 0.25rem 0.625rem;
			border: 1px solid var(--line);
			font-size: 0.875rem;
			text-decoration: none;
		}

		.docs-nav__pages > li > a:hover { text-decoration: underline; }

		.docs-nav__pages > li > a[aria-current="page"] {
			border-color: var(--lime);
			color: var(--lime);
			font-weight: 700;
		}

		.docs-nav__toc { display: none; }

		@media (min-width: 60rem) {
			.docs-nav {
				position: sticky;
				inset-block-start: 1.5rem;
				align-self: start;
				max-block-size: calc(100dvh - 3rem);
				overflow: auto;
			}

			html:has(.site-header[data-state="shown"]) .docs-nav {
				inset-block-start: 7rem;
				max-block-size: calc(100dvh - 8.5rem);
			}

			.docs-nav__pages {
				display: grid;
				gap: 0.125rem;
			}

			.docs-nav__pages > li > a {
				padding: 0.375rem 0 0.375rem 0.875rem;
				border: 0;
				border-inline-start: 2px solid var(--line);
				font-size: 0.9375rem;
			}

			.docs-nav__pages > li > a[aria-current="page"] { border-inline-start-color: var(--lime); }

			.docs-nav .docs-nav__toc {
				display: grid;
				border-inline-start: 2px solid var(--pale);
				font-size: 0.875rem;
				line-height: 1.35;
			}

			.docs-nav__toc a {
				display: block;
				padding: 0.3125rem 0 0.3125rem 1.75rem;
				color: var(--muted);
				text-decoration: none;
			}

			.docs-nav__toc a:hover {
				color: var(--text);
				text-decoration: underline;
			}
		}

		@media (min-width: 60rem) and (prefers-reduced-motion: no-preference) {
			.docs-nav { transition: inset-block-start 0.3s ease; }
		}

		/* Article */

		.docs-main { min-width: 0; }

		.prose {
			max-width: 48rem;
			overflow-wrap: break-word;
		}

		.prose h1 {
			margin: 0 0 1.25rem;
			font-size: clamp(2.25rem, 6vw, 3.25rem);
			font-weight: 800;
			line-height: 1.08;
			letter-spacing: -0.035em;
		}

		.prose h1 + p {
			font-size: 1.1875rem;
			color: var(--muted);
		}

		.prose h2,
		.prose h3 { line-height: 1.25; }

		.prose h2 {
			margin: 3.5rem 0 1rem;
			font-size: 1.75rem;
			font-weight: 800;
			letter-spacing: -0.02em;
		}

		.prose h3 {
			margin: 2.25rem 0 0.75rem;
			font-size: 1.25rem;
			font-weight: 700;
		}

		.prose :is(h2, h3) a { text-decoration: none; }

		.prose :is(h2, h3) a:hover { text-decoration: underline; }

		.prose :is(h2, h3) a::before {
			content: "#";
			content: "#" / "";
			margin-inline-end: 0.35em;
			color: var(--line-strong);
			font-weight: 600;
		}

		.prose :is(h2, h3) a:hover::before { color: var(--lime); }

		@media (min-width: 60rem) {
			.prose :is(h2, h3) a { position: relative; }

			.prose :is(h2, h3) a::before {
				position: absolute;
				inset-inline-end: 100%;
			}
		}

		.prose p,
		.prose ul,
		.prose ol { margin: 0 0 1rem; }

		.prose li + li { margin-top: 0.375rem; }

		.prose a:not(:is(h2, h3) a) { color: var(--lime); }

		.prose :not(pre) > code {
			padding: 0.125em 0.375em;
			border-radius: 0.25rem;
			background: var(--code-bg);
			font-size: 0.875em;
		}

		.prose pre {
			margin: 0 0 1.5rem;
			padding: 1.25rem 1.5rem;
			overflow-x: auto;
			border-radius: 0.75rem;
			background: var(--pre-bg);
			color: #dfe5d3;
			font-size: 0.875rem;
			line-height: 1.7;
			tab-size: 4;
		}

		.table {
			margin: 0 0 1.5rem;
			overflow-x: auto;
		}

		.table table {
			min-width: 100%;
			border-collapse: collapse;
			font-size: 0.9375rem;
		}

		.table th,
		.table td {
			padding: 0.625rem 0.75rem;
			border-bottom: 1px solid var(--line);
			text-align: left;
			vertical-align: top;
		}

		.table th {
			color: var(--muted);
			font-weight: 700;
		}

		.table td:first-child code { white-space: nowrap; }

		.docs-meta {
			max-width: 48rem;
			margin-top: 4rem;
			padding-top: 1.5rem;
			border-top: 1px solid var(--line);
			color: var(--muted);
			font-size: 0.9375rem;
		}

		.docs-meta p { margin: 0; }

		.docs-meta p + p { margin-top: 0.5rem; }

		/* Footer */

		.site-footer {
			padding-block: 3rem;
			color: var(--muted);
			font-size: 0.9375rem;
		}

		.site-footer p { margin: 0; }

		.site-footer p + p { margin-top: 0.5rem; }
	</style>
	<script src="/header.js" defer></script>
</head>
<body>
	<a class="skip" href="#content">Skip to content</a>
	<header class="site-header">
		<div class="site-header__bar">
			<nav class="wrap topbar" aria-label="Main">
				<a class="wordmark" href="/"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="7" fill="#d9dbd5"/><rect x="4" y="13" width="11" height="6" rx="3" fill="#22241f"/><rect x="17" y="13" width="11" height="6" rx="3" fill="#22241f"/></svg><span>Silvertrail</span></a>
				<div class="topbar__links">
					<a href="/#developers">Developers</a>
					<a href="/#features">Features</a>
					<a class="topbar__docs" href="/docs/" aria-current="true">Docs</a>
					<a href="https://github.com/mawiswiss/silvertrail">GitHub</a>
					<a class="topbar__licence" href="/#licence">Honour licence</a>
				</div>
			</nav>
		</div>
	</header>

	<div class="wrap docs">
		<nav class="docs-nav" aria-label="Documentation">
{{nav}}
		</nav>
		<main class="docs-main" id="content">
			<article class="prose">
{{content}}
			</article>
			<footer class="docs-meta">
				<p>Generated from Silvertrail {{version}}. <a href="{{markdown}}">Markdown</a> · <a href="{{source}}">Source on GitHub</a></p>
			</footer>
		</main>
	</div>

	<footer class="wrap site-footer">
		<p>Silvertrail is made by <a href="https://marcwieland.name">Marc Wieland</a> and licensed under the GPL.</p>
		<p>The plugin is on <a href="https://wordpress.org/plugins/silvertrail/">WordPress.org</a>, and its code is on <a href="https://github.com/mawiswiss/silvertrail">GitHub</a>.</p>
	</footer>
</body>
</html>
