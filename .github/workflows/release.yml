name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Match the tag to the version
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -Eq "^ \* Version: +$v\$" silvertrail.php || { echo "::error::The Version header in silvertrail.php is not $v."; exit 1; }
          grep -Eq "^const SILVERTRAIL_VERSION += '$v';" silvertrail.php || { echo "::error::SILVERTRAIL_VERSION is not $v."; exit 1; }
          grep -Eq "^Stable tag: $v\$" readme.txt || { echo "::error::The Stable tag in readme.txt is not $v."; exit 1; }

      - name: Build
        shell: bash
        run: rsync -a --exclude-from=<(sed 's#^/##' .distignore) ./ build/silvertrail/

      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/silvertrail'

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build && zip -qr ../silvertrail.zip silvertrail)
          gh release upload "$GITHUB_REF_NAME" silvertrail.zip --clobber

      - name: Deploy to WordPress.org
        if: vars.WPORG_DEPLOY == 'true'
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SLUG: silvertrail
          BUILD_DIR: build/silvertrail
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
